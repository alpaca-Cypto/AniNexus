[project]
name = "aninexus-api"
version = "0.1.0"
description = "AniNexus FastAPI service"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.141.1",
    "pydantic-settings>=2.13.1,<3",
    "uvicorn[standard]>=0.41.0,<1",
]

[build-system]
requires = ["hatchling>=1.29.0,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

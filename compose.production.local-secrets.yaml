# Windows Docker Desktop can expose ACL-protected host files as directories.
# The one-click launcher copies the same passwords to this Docker-managed volume.
services:
  mysql:
    secrets: !reset []
    volumes:
      - mysql_secrets:/run/secrets:ro
  backend:
    secrets: !reset []
    volumes:
      - app_secrets:/run/secrets:ro
  db-migrate:
    secrets: !reset []
    volumes:
      - app_secrets:/run/secrets:ro
  catalog-import:
    secrets: !reset []
    volumes:
      - app_secrets:/run/secrets:ro
  bangumi-refresh:
    secrets: !reset []
    volumes:
      - app_secrets:/run/secrets:ro

volumes:
  mysql_secrets:
    name: aninexus-production_local_secrets
    external: true
  app_secrets:
    name: aninexus-production_app_secrets
    external: true
